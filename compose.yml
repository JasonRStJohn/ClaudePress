# Top-level compose for running ClaudePress standalone (smoke-test mode).
# Real sites use their own compose.yml that extends compose.base.yml.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - pb_data:/pb/pb_data
    environment:
      NUXT_REVALIDATE_URL: http://frontend:3000/api/revalidate
      NUXT_REVALIDATE_SECRET: ${REVALIDATE_SECRET:-dev-secret-change-me}

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      POCKETBASE_URL: http://backend:8090
      NUXT_PUBLIC_PB_URL: ${NUXT_PUBLIC_PB_URL:-http://localhost:8090}
      NUXT_PUBLIC_SITE_NAME: ${NUXT_PUBLIC_SITE_NAME:-ClaudePress Dev}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-dev-secret-change-me}

volumes:
  pb_data:
